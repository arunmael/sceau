_comment: |
  Projektdefinition für XcodeGen. Die Datei Sceau.xcodeproj wird daraus
  erzeugt und ist deshalb bewusst nicht versioniert (siehe .gitignore) —
  Quelle der Wahrheit ist allein diese Datei.

  Neu erzeugen mit:  xcodegen generate

name: Sceau

options:
  bundleIdPrefix: ch.arunmeyer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: de
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GCC_TREAT_WARNINGS_AS_ERRORS: false

packages:
  SceauCore:
    path: .

targets:
  Sceau:
    type: application
    platform: macOS
    sources:
      - path: App/Sceau
        excludes:
          - "Info.plist"
    dependencies:
      - package: SceauCore
        product: SceauCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.arunmeyer.Sceau
        PRODUCT_NAME: Sceau
        INFOPLIST_FILE: App/Sceau/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Sceau/Sceau.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: true
        CODE_SIGNING_ALLOWED: true
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Sceau:
    build:
      targets:
        Sceau: all
    run:
      config: Debug
    test:
      config: Debug
